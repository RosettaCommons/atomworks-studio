[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atomworks-studio-editing"
version = "0.0.1"
readme = { text = "Shared document editing for AtomWorks Studio. Provides molecular structure and annotation edits, selections, protonation, CIF serialization, and transactional Undo for the browser and native PyMOL interfaces.", content-type = "text/markdown" }
description = "Shared annotated-CIF editing primitives for AtomWorks Studio editors"
requires-python = ">=3.12,<3.13"
license = "BSD-3-Clause"
dependencies = [
    "atomworks[ml]==3.0.1",
    "numpy>=1.26,<3",
]

[project.urls]
Documentation = "https://github.com/RosettaCommons/atomworks-studio/blob/main/docs/index.md"
Source = "https://github.com/RosettaCommons/atomworks-studio"

[tool.hatch.build.targets.wheel]
packages = ["atomworks_studio_editing"]

[tool.hatch.build.targets.sdist]
include = [
    "atomworks_studio_editing",
    "pyproject.toml",
]
