[package]
name = "annotation-studio-core"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Lossless AtomWorks annotated-CIF inspection for the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
